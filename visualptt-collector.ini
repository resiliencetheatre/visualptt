# Collector-only configuration. Do not add these settings to pttkey.ini.
# Create all directories before starting; use absolute paths without symlinks.
[collector]
local_peer = A
input_dir = /home/alice/visualptt/inbox
state_dir = /home/alice/visualptt/collector-state
poll_seconds = 2
# 1: final-name publication contract. 2: also require two unchanged scans.
stable_scans = 1

# This is A's VisualPTT output_dir, never an incoming source.
# Enable purge only on the originating host, never on a remote replica.
own_pool = /home/alice/visualptt/outgoing
purge_enabled = false
purge_interval_seconds = 900
retention_seconds = 172800

[sources]
B = /home/alice/visualptt/pools/B
C = /home/alice/visualptt/pools/C
