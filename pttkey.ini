[pttkey]
keyboard_device=/dev/input/event0
ptt_down_type = 1 
ptt_down_code = 100 
ptt_down_value = 1 
ptt_up_type = 1 
ptt_up_code = 100 
ptt_up_value = 0 
output_dir = output
indicator_file = output/incoming.flag

ptt_down_threshold_ms = 1000
annotation_clear_delay_seconds = 10
ptt_start_wav = sounds/ptt_start.wav
ptt_end_wav   = sounds/ptt_end.wav

# Uses the desktop's default microphone through PipeWire/PulseAudio when
# available. To force a device, examples include:
# audio_source = pulsesrc device=alsa_input.usb-Plantronics_...
# audio_source = alsasrc device=hw:2,0
audio_source = autoaudiosrc
