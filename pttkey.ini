[pttkey]
keyboard_device=/dev/input/event0
ptt_down_type = 1 
ptt_down_code = 100 
ptt_down_value = 1 
ptt_up_type = 1 
ptt_up_code = 100 
ptt_up_value = 0 

output_dir = ./recdir
